view: form
beanClass: tools.dynamia.chronos.domain.CronJob
autofields: false

fields:
  name:
    params:
      span: 4
  description:
    params:
      multiline: true
      height: 80px
      span: 4
  httpMethod:
  serverHost:
    label: Server Host (URL)
    params:
      span: 2
  serverPort:
  serverAuthorization:
  serverTimeout:
  cronExpression:
  contentType:

  active:
  notifyFails:
  notifyExecutions:
  headers:
    label: Custom Headers
    component: headerseditor
    params:
      span: 4


layout:
  columns: 4
