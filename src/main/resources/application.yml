dynamia:
  app:
    name: Dynamia Chronos
    author: @project.organization.name@
    version: @project.version@
    template: Dynamical
    default-skin: Dynamia
    base-package: tools.dynamia
    default-logo: /static/chronos-logo.png
    default-icon: /static/chronos-icon.png




spring:
  application:
    name: Dynamia Chronos


  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/dynamiachronos}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:

    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: ${PORT:8080}

chronos:
  http:
    # Bounded thread pool backing the shared HttpClient used by every
    # scheduled job/test run (see ChronosHttpClientConfig). Each job's own
    # serverTimeout still governs its request/response window and always
    # takes priority over this — these two only bound the shared connection
    # machinery, not any single job's behavior.
    thread-pool-size: ${CHRONOS_HTTP_THREAD_POOL_SIZE:20}
    connect-timeout: ${CHRONOS_HTTP_CONNECT_TIMEOUT:10s}
