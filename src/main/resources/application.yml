dynamia:
  app:
    name: Dynamia Chronos
    author: @project.organization.name@
    version: @project.version@
    template: Dynamical
    default-skin: Dynamia
    base-package: tools.dynamia
    default-logo: /static/chronos-logo.png
    default-icon: /static/chronos-icon.png




spring:
  application:
    name: Dynamia Chronos


  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/dynamiachronos}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # Runs schema.sql (currently just the shedlock table) on every boot.
      # No migration tool: CREATE TABLE IF NOT EXISTS keeps it idempotent.
      mode: always

  jpa:

    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: ${PORT:8080}

management:
  # Actuator runs on its own port, separate from the main app (server.port).
  # Deliberate choice over securing /actuator/** behind the app's own auth:
  # this port is meant to stay unreachable from outside the cluster/host
  # network (no public ingress, no port-forward) — restrict it at the
  # network layer (k8s Service/NetworkPolicy, firewall), not with a login.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness,
      # the two k8s probes should point at.
      probes:
        enabled: true
      group:
        readiness:
          # Deliberately widened past Spring Boot's default (readinessState
          # only): Chronos can't do its one job — running scheduled HTTP
          # calls and persisting the result — without the DB, so a broken
          # DB connection should fail readiness and pull the pod out of the
          # k8s Service, not just leave it marked "started".
          # DataSourceHealthContributorAutoConfiguration already registers a
          # "db" indicator backed by a real connection-validation query, no
          # custom HealthIndicator needed here.
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

chronos:
  http:
    # Bounded thread pool backing the shared HttpClient used by every
    # scheduled job/test run (see ChronosHttpClientConfig). Each job's own
    # serverTimeout still governs its request/response window and always
    # takes priority over this — these two only bound the shared connection
    # machinery, not any single job's behavior.
    thread-pool-size: ${CHRONOS_HTTP_THREAD_POOL_SIZE:20}
    connect-timeout: ${CHRONOS_HTTP_CONNECT_TIMEOUT:10s}
